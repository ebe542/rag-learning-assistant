[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-learning-assistant"
version = "0.1.0"
description = "A source-grounded learning assistant for PDF documents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "RAG Learning Assistant contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
rag-learn = "rag_learning_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_learning_assistant"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

