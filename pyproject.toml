[project]
name = "rag-learning-assistant"
version = "0.2.0"
description = "A source-grounded learning assistant for PDF documents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "RAG Learning Assistant contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "pymupdf>=1.24,<2",
  "python-dotenv>=1,<2",
]

[project.scripts]
rag-learn = "rag_learning_assistant.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]
embeddings = [
  "sentence-transformers>=5,<6",
]
generation = [
  "accelerate>=1,<2",
  "torch>=2.6,<3",
  "transformers>=5,<6",
]
storage = [
  "faiss-cpu>=1.14,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_learning_assistant"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Pytest base-temp directories may remain locked on Windows. They contain no
# source files and must not be traversed by formatting or lint checks.
extend-exclude = [".pytest-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
