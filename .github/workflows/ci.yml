name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Storage tests exercise the real FAISS adapter, so CI needs that optional extra.
      - run: python -m pip install -e ".[dev,storage]"
      # CI and local milestone checks intentionally share one quality gate.
      - run: python scripts/check_milestone.py
