name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and build release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install quality and release dependencies
        run: python -m pip install -e ".[dev,gui,storage,release]"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)[1-9][0-9]*)?$ ]]; then
            printf 'Invalid release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          # checkout resolves a tag-triggered run to its commit. Fetch the
          # published tag ref explicitly so cat-file inspects the tag object
          # instead of a checkout-created commit reference.
          git fetch --force origin \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

          if [[ "$(git cat-file -t "$RELEASE_TAG")" != "tag" ]]; then
            printf 'Release tag must be annotated: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            printf 'Release tag is not based on main: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            printf 'Tag %s does not match package version %s\n' "$RELEASE_TAG" "$package_version" >&2
            exit 1
          fi

          if ! grep -Eq "^## \[$package_version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            printf 'CHANGELOG.md has no dated release section for %s\n' "$package_version" >&2
            exit 1
          fi

      - name: Run quality gate
        run: python scripts/check_milestone.py

      - name: Verify installable release package
        run: python scripts/check_release_package.py

      - name: Build release assets
        run: python -m build --outdir dist .

      - name: Check release asset metadata
        run: python -m twine check dist/*

      - name: Extract release notes from changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/extract_release_notes.py "${RELEASE_TAG#v}" --output dist/release-notes.md

      - name: Upload verified release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download verified release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          release_options=()
          if [[ "$RELEASE_TAG" =~ (a|b|rc)[1-9][0-9]*$ ]]; then
            release_options+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            --verify-tag \
            --notes-file dist/release-notes.md \
            --title "$RELEASE_TAG" \
            "${release_options[@]}"
